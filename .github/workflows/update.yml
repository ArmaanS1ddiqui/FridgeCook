name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    name: OTA Update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Skipping update."
            exit 1
          fi
          echo "Token is set"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: eas update --branch production --platform android --message "${{ github.event.head_commit.message }}"
